# help you search for items. Doesn't care about upper or lower case. 
query SearchItems($pattern: String!) @auth(level: USER) {
  items(
    where: {
      itemName: {
        pattern: {
          like: $pattern
          ignoreCase: true
        }
      }
    }
    orderBy: { itemName: ASC }
    limit: 20
  )

  {
    id
    itemName
    brand
    unitSize
  }
}

# Grab the price of the item if it's public
query GetItemPrices($itemId: UUID!) @auth(level: USER) {
  priceRecords: _select(
    sql: """
      SELECT
        pr.id,
        pr.price,
        pr.date_recorded AS "dateRecorded",
        pr.is_public AS "isPublic",
        jsonb_build_object(
          'id', i.id,
          'itemName', i.item_name,
          'brand', i.brand,
          'unitSize', i.unit_size
        ) AS "item",
        jsonb_build_object(
          'id', s.id,
          'storeName', s.store_name,
          'storeLocation', s.store_location
        ) AS "store"
      FROM price_record pr
      JOIN item i ON i.id = pr.item_id
      JOIN store s ON s.id = pr.store_id
      WHERE pr.item_id = $1::uuid
        AND pr.is_public = TRUE
        AND EXISTS (
          SELECT 1
          FROM price_submission ps
          WHERE ps.price_record_id = pr.id
            AND ps.ended_at IS NULL
        )
      ORDER BY pr.date_recorded DESC, pr.id DESC
      LIMIT 50
    """
    params: [$itemId]
  )
}

# Let you search for stores when you're trying to submit a  price.
query SearchStores($pattern: String!) @auth(level: USER) {
  stores(
    where: {
      storeName: {
        pattern: {
          like: $pattern
          ignoreCase: true
        }
      }
    }
    orderBy: { storeName: ASC }
    limit: 20
  )
  
  {
    id
    storeName
    storeLocation
  }
}

# grab the user's account age and number of price submissions for voter reputation.
# count each public price pool once, even if the user rejoins.
query GetUserStats($userId: String!) @auth(level: USER) {
  user(
    key: { id: $userId }
  ) {
    id
    createdAt
  }

  totalSubmissions: _selectFirst(
    sql: """
      SELECT COUNT(DISTINCT ps.price_record_id) AS "count"
      FROM price_submission ps
      JOIN price_record pr
        ON pr.id = ps.price_record_id
      WHERE ps.user_id = $1
        AND pr.is_public = TRUE
    """
    params: [$userId]
  )
}

# grab the user's previous submissions and their unweighted votes for submitter reputation.
# use limit and offset to grab more history.
query GetSubmitterVoteHistory(
  $userId: String!
  $limit: Int!
  $offset: Int!
) @auth(level: USER) {
  priceHistory: _select(
    sql: """
      SELECT
        ps.price_record_id AS "priceRecordId",
        ps.created_at AS "submittedAt",
        COUNT(*) FILTER (WHERE pv.is_upvote = TRUE) AS "upvotes",
        COUNT(*) FILTER (WHERE pv.is_upvote = FALSE) AS "downvotes"
      FROM price_submission ps
      JOIN price_record pr
        ON pr.id = ps.price_record_id
      LEFT JOIN price_vote pv
        ON pv.price_record_id = ps.price_record_id
        AND pv.created_at >= ps.created_at
        AND (
          ps.ended_at IS NULL
          OR pv.created_at < ps.ended_at
        )
      WHERE ps.user_id = $1
        AND pr.is_public = TRUE
      GROUP BY ps.price_record_id, ps.created_at
      ORDER BY ps.created_at DESC, ps.price_record_id DESC
      LIMIT $2 OFFSET $3
    """
    params: [$userId, $limit, $offset]
  )
}

# grab all the votes for a price to calculate the weighted consensus.
# also grab the voter's account age and when they voted.
query GetPriceVotes(
  $priceRecordId: UUID!
  $limit: Int!
  $offset: Int!
) @auth(level: USER) {
  votes: _select(
    sql: """
      SELECT
        pv.price_record_id AS "priceRecordId",
        pv.user_id AS "userId",
        pv.is_upvote AS "isUpvote",
        pv.created_at AS "createdAt",
        u.created_at AS "accountCreatedAt"
      FROM price_vote pv
      JOIN "user" u
        ON u.id = pv.user_id
      JOIN price_record pr
        ON pr.id = pv.price_record_id
      WHERE pv.price_record_id = $1
        AND pr.is_public = TRUE
      ORDER BY pv.created_at DESC, pv.user_id ASC
      LIMIT $2 OFFSET $3
    """
    params: [$priceRecordId, $limit, $offset]
  )
}

# grab everyone who submitted a shared public price.
query GetPriceSubmitters(
  $priceRecordId: UUID!
  $limit: Int!
  $offset: Int!
) @auth(level: USER) {
  submitters: _select(
    sql: """
      SELECT
        ps.user_id AS "userId",
        ps.created_at AS "submittedAt"
      FROM price_submission ps
      JOIN price_record pr
        ON pr.id = ps.price_record_id
      WHERE ps.price_record_id = $1
        AND pr.is_public = TRUE
        AND ps.ended_at IS NULL
      ORDER BY ps.created_at ASC, ps.user_id ASC
      LIMIT $2 OFFSET $3
    """
    params: [$priceRecordId, $limit, $offset]
  )
}

# grab the price information needed to calculate its final confidence.
query GetPriceConfidenceData($priceRecordId: UUID!) @auth(level: USER) {
  priceRecords: _select(
    sql: """
      SELECT
        pr.id,
        pr.price,
        pr.date_recorded AS "dateRecorded",
        pr.is_public AS "isPublic",
        jsonb_build_object(
          'id', i.id,
          'itemName', i.item_name
        ) AS "item",
        jsonb_build_object(
          'id', s.id,
          'storeName', s.store_name
        ) AS "store"
      FROM price_record pr
      JOIN item i ON i.id = pr.item_id
      JOIN store s ON s.id = pr.store_id
      WHERE pr.id = $1::uuid
        AND pr.is_public = TRUE
        AND EXISTS (
          SELECT 1
          FROM price_submission ps
          WHERE ps.price_record_id = pr.id
            AND ps.ended_at IS NULL
        )
      LIMIT 1
    """
    params: [$priceRecordId]
  )
}

# grab the price history of an item at a specific store.
# only show prices that are public.
query GetPriceHistory(
  $itemId: UUID!
  $storeId: UUID!
  $limit: Int!
  $offset: Int!
) @auth(level: USER) {
  priceRecords(
    where: {
      itemId: { eq: $itemId }
      storeId: { eq: $storeId }
      isPublic: { eq: true }
    }
    orderBy: [
      { dateRecorded: DESC }
      { id: DESC }
    ]
    limit: $limit
    offset: $offset
  )

  {
    id
    price
    dateRecorded

    item {
      id
      itemName
      brand
      unitSize
    }

    store {
      id
      storeName
      storeLocation
    }
  }
}

# grab all the prices submitted by a user.
# let them see their previous submissions including private ones.
query GetUserSubmissions(
  $limit: Int!
  $offset: Int!
) @auth(level: USER) {
  submissions: _select(
    sql: """
      SELECT
        pr.id AS "priceRecordId",
        pr.price,
        pr.date_recorded AS "dateRecorded",
        pr.is_public AS "isPublic",
        ps.created_at AS "submittedAt",
        ps.ended_at AS "endedAt",
        i.id AS "itemId",
        i.item_name AS "itemName",
        s.id AS "storeId",
        s.store_name AS "storeName",
        s.store_location AS "storeLocation"
      FROM price_submission ps
      JOIN price_record pr
        ON pr.id = ps.price_record_id
      JOIN item i
        ON i.id = pr.item_id
      JOIN store s
        ON s.id = pr.store_id
      WHERE ps.user_id = $1
      ORDER BY ps.created_at DESC, pr.id DESC
      LIMIT $2 OFFSET $3
    """
    params: [
      {_expr: "auth.uid"}
      $limit
      $offset
    ]
  )
}

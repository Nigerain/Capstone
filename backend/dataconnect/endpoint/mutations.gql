
# create their account after they sign up using Firebase Authentication.
# the backend verifies their identity before creating their profile.
mutation CreateUserProfile(
  $userId: String!
  $username: String!
  $firstName: String!
  $lastName: String!
  $email: String!
) @auth(level: NO_ACCESS) {
  user_insert(
    data: {
      id: $userId
      username: $username
      firstName: $firstName
      lastName: $lastName
      email: $email
    }
  )
}

# let users submit a price manually or using OCR.
# the backend verifies the user before saving their price.
mutation CreatePrice(
  $itemId: UUID!
  $storeId: UUID!
  $userId: String!
  $price: Float!
  $isPublic: Boolean!
) @auth(level: NO_ACCESS) {
  priceRecord_insert(
    data: {
      itemId: $itemId
      storeId: $storeId
      userId: $userId
      price: $price
      isPublic: $isPublic
    }
  )
}

# verify they're logged in and authenticated before letting them make items.
mutation CreateItem(
  $itemName: String!
  $brand: String
  $unitSize: String
) @auth(level: NO_ACCESS) {
  item_insert(
    data: {
      itemName: $itemName
      brand: $brand
      unitSize: $unitSize
    }
  )
}

# verify they're logged in and authenticated before letting them make stores.
mutation CreateStore(
  $storeName: String!
  $storeLocation: String
) @auth(level: NO_ACCESS) {
  store_insert(
    data: {
      storeName: $storeName
      storeLocation: $storeLocation
    }
  )
}

# let users upvote or downvote a submitted price.
# if they already voted, update their existing vote.
# the backend verifies the user and prevents self-voting.
mutation SubmitPriceVote(
  $priceRecordId: UUID!
  $userId: String!
  $isUpvote: Boolean!
) @auth(level: NO_ACCESS) {
  _execute(
    sql: """
      INSERT INTO price_vote (
        price_record_id,
        user_id,
        is_upvote,
        created_at
      )
      SELECT $1, $2, $3, NOW()
      WHERE EXISTS (
        SELECT 1
        FROM price_record
        WHERE id = $1
          AND user_id <> $2
          AND is_public = TRUE
      )
      ON CONFLICT (price_record_id, user_id)
      DO UPDATE SET is_upvote = EXCLUDED.is_upvote
    """
    params: [$priceRecordId, $userId, $isUpvote]
  )
}

# let users remove their own vote from a submitted price.
# the backend verifies that the vote belongs to the user.
mutation RemovePriceVote(
  $priceRecordId: UUID!
  $userId: String!
) @auth(level: NO_ACCESS) {
  _execute(
    sql: """
      DELETE FROM price_vote
      WHERE price_record_id = $1
        AND user_id = $2
    """
    params: [$priceRecordId, $userId]
  )
}